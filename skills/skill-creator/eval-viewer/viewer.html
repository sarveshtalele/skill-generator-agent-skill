<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eval Viewer</title>
    <style>
        :root {
            --bg-color: #1e1e2e;
            --surface-color: #2a2a3e;
            --text-color: #cdd6f4;
            --text-muted: #a6adc8;
            --primary: #89b4fa;
            --success: #a6e3a1;
            --error: #f38ba8;
            --border: #45475a;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .tabs {
            display: flex;
            border-bottom: 2px solid var(--border);
            margin-bottom: 20px;
        }
        .tab {
            padding: 10px 20px;
            cursor: pointer;
            color: var(--text-muted);
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
        }
        .tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .card {
            background-color: var(--surface-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }
        h2, h3 { margin-top: 0; }
        pre, code {
            font-family: "Fira Code", monospace;
            background-color: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            white-space: pre-wrap;
        }
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: bold;
        }
        .badge.pass { background-color: rgba(166, 227, 161, 0.2); color: var(--success); }
        .badge.fail { background-color: rgba(243, 139, 168, 0.2); color: var(--error); }
        textarea {
            width: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 10px;
            margin-top: 10px;
            min-height: 80px;
            resize: vertical;
            box-sizing: border-box;
        }
        button {
            background-color: var(--primary);
            color: var(--bg-color);
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover { opacity: 0.9; }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        th { color: var(--text-muted); }
        .flex { display: flex; gap: 20px; }
        .flex-1 { flex: 1; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Evaluation Results</h1>
        <div class="tabs">
            <div class="tab active" onclick="switchTab('outputs')">Outputs</div>
            <div class="tab" onclick="switchTab('benchmark')">Benchmark</div>
        </div>

        <div id="outputs-tab" class="tab-content active"></div>
        <div id="benchmark-tab" class="tab-content"></div>
    </div>

    <script>
        window.__EVAL_DATA__ = {}; // Injected by generate_review.py

        function switchTab(tabId) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelector(`.tab[onclick="switchTab('${tabId}')"]`).classList.add('active');
            document.getElementById(`${tabId}-tab`).classList.add('active');
        }

        async function submitFeedback(caseId) {
            const feedbackText = document.getElementById(`feedback-${caseId}`).value;
            try {
                const response = await fetch('/api/feedback', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ caseId, feedback: feedbackText })
                });
                if (response.ok) alert('Feedback saved!');
                else alert('Failed to save feedback');
            } catch (e) {
                alert('Error saving feedback: ' + e.message);
            }
        }

        function escapeHtml(unsafe) {
            return (unsafe || '').toString()
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        function renderOutputs() {
            const data = window.__EVAL_DATA__.outputs || [];
            const container = document.getElementById('outputs-tab');
            if (!data.length) {
                container.innerHTML = '<div class="card">No outputs data available.</div>';
                return;
            }

            container.innerHTML = data.map(item => `
                <div class="card">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                        <h3>Case: ${escapeHtml(item.id)}</h3>
                        <span class="badge ${item.passed ? 'pass' : 'fail'}">${item.passed ? 'PASS' : 'FAIL'}</span>
                    </div>
                    <div>
                        <strong>Prompt:</strong>
                        <pre>${escapeHtml(item.prompt)}</pre>
                    </div>
                    <div class="flex">
                        <div class="flex-1">
                            <strong>Output:</strong>
                            <pre>${escapeHtml(item.output)}</pre>
                            ${item.image ? `<img src="${item.image}" style="max-width:100%; border-radius:4px; margin-top:10px;" />` : ''}
                        </div>
                        <div class="flex-1">
                            <strong>Feedback:</strong>
                            <textarea id="feedback-${escapeHtml(item.id)}" placeholder="Enter human feedback...">${escapeHtml(item.feedback)}</textarea>
                            <button onclick="submitFeedback('${escapeHtml(item.id)}')">Submit Feedback</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderBenchmark() {
            const data = window.__EVAL_DATA__.benchmark || {};
            const container = document.getElementById('benchmark-tab');
            if (!Object.keys(data).length) {
                container.innerHTML = '<div class="card">No benchmark data available.</div>';
                return;
            }

            container.innerHTML = `
                <div class="card">
                    <h3>Performance Delta (With Skill vs Without Skill)</h3>
                    <table>
                        <thead>
                            <tr>
                                <th>Metric</th>
                                <th>Without Skill</th>
                                <th>With Skill</th>
                                <th>Delta</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Pass Rate</td>
                                <td>${data.passRateWithout || '0'}%</td>
                                <td>${data.passRateWith || '0'}%</td>
                                <td>${(data.passRateWith || 0) - (data.passRateWithout || 0)}%</td>
                            </tr>
                            <tr>
                                <td>Avg Time (s)</td>
                                <td>${data.timeWithout || '0'}</td>
                                <td>${data.timeWith || '0'}</td>
                                <td>${((data.timeWith || 0) - (data.timeWithout || 0)).toFixed(2)}</td>
                            </tr>
                            <tr>
                                <td>Tokens Used</td>
                                <td>${data.tokensWithout || '0'}</td>
                                <td>${data.tokensWith || '0'}</td>
                                <td>${(data.tokensWith || 0) - (data.tokensWithout || 0)}</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            `;
        }

        // Initialize UI
        if (Object.keys(window.__EVAL_DATA__).length > 0) {
            renderOutputs();
            renderBenchmark();
        } else {
            // Mock data for testing if not injected
            window.__EVAL_DATA__ = {
                outputs: [
                    { id: "test-1", passed: true, prompt: "Generate a function", output: "def test(): pass" },
                    { id: "test-2", passed: false, prompt: "Fix the bug", output: "Error: Not implemented" }
                ],
                benchmark: { passRateWithout: 40, passRateWith: 80, timeWithout: 15, timeWith: 12, tokensWithout: 5000, tokensWith: 4200 }
            };
            renderOutputs();
            renderBenchmark();
        }
    </script>
</body>
</html>
