name: skill-creator
display_name: Skill Creator Skill
version: "2.0.0"
description: "Interactive, Q&A-driven Agent Skill creator and optimizer. Generates Spec 1.0 compliant skills, custom SDD bundles, testing checklists, multi-type assertions, runs evaluator audits, launches interactive eval reviews, optimizes trigger descriptions, and packages .skill archives."
author: "Sarvesh Talele"
license: MIT
category: code-analysis
tags:
  - skill-creator
  - sdlc
  - agent-skills
  - scaffolding
  - trigger-optimization
runtime:
  engine: python
  min_version: "3.8"
  entry_point: scripts/skill_scaffolder.py
  dependencies: []
tools:
  - run_in_terminal
  - read_file
  - file_search
  - grep_search
entry_files:
  skill_definition: SKILL.md
