name: evaluator-skill
display_name: Evaluator Skill
version: "2.0.0"
description: "Audits agent skills on quality (specification compliance, progressive disclosure, functional correctness, baseline lift, trigger F1) and security (NVIDIA SkillSpector 68-pattern AST taint tracking, YARA signatures, Unicode deception, and optional semantic analysis), producing scored Markdown, JSON, and SARIF reports."
author: "Sarvesh Talele"
license: MIT
category: code-analysis
tags:
  - evaluator-skill
  - sdlc
  - agent-skills
  - security-audit
  - ragas-evaluation
runtime:
  engine: python
  min_version: "3.8"
  entry_point: scripts/run_evaluation.py
  dependencies: []
tools:
  - run_in_terminal
  - read_file
  - file_search
  - grep_search
entry_files:
  skill_definition: SKILL.md
