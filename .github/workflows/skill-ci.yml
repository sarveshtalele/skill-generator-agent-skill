name: Skill Quality Gate

on:
  pull_request:
    paths: ['skills/**']
  push:
    branches: [main]

jobs:
  evaluate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        skill: [skill-creator, evaluator-skill]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Spec Compliance
        run: python skills/evaluator-skill/scripts/structural_check.py skills/${{ matrix.skill }} --json

      - name: Run Security Scan
        run: |
          python skills/evaluator-skill/scripts/security_scan.py skills/${{ matrix.skill }} \
            --format sarif --output results-${{ matrix.skill }}.sarif

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results-${{ matrix.skill }}.sarif
          category: skillspector-${{ matrix.skill }}

      - name: Run Full Evaluation
        run: |
          python skills/evaluator-skill/scripts/run_evaluation.py \
            --skill skills/${{ matrix.skill }} \
            --output ./scorecards \
            --format json

      - name: Check Quality Gate
        run: |
          SCORE=$(python -c "import json; d=json.load(open('scorecards/${{ matrix.skill }}.json')); print(d.get('overall_score', 0))")
          GATE=$(python -c "import json; d=json.load(open('scorecards/${{ matrix.skill }}.json')); print(d.get('gate_decision', 'BLOCK'))")
          echo "Score: $SCORE | Gate: $GATE"
          if [ "$GATE" = "BLOCK" ]; then
            echo "::error::Quality gate BLOCKED for ${{ matrix.skill }} (score: $SCORE)"
            exit 1
          fi

      - name: Upload Scorecard Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scorecard-${{ matrix.skill }}
          path: scorecards/${{ matrix.skill }}.*
